<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2b2b2b">

    <!-- iOS-specific tags -->
    <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="tuneup">

    <!-- favicon for browser tabs -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/favicon-16x16.png">
    <title> tuneup </title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">
    <script src="/static/script.js" defer></script>
  </head>
  <body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <div class="sidebar">
        <div class="sidebar-header">catalog</div>
        <ul class="sidebar-list"></ul>
    </div>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="main-content">
      <div class="search-container">
        <input type="text" class="search-input" placeholder="search songs, artists, albums...">
        <button class="back-btn" onclick="closeSearchResults()">
          <i class="fa fa-home"></i>
        </button>
      </div>
      <div class="search-results" style="display: none;">
        <ul class="results-list"></ul>
      </div>
    
    <div class="player">
      <!-- Define the section for displaying details -->
      <div class="details">
        <div class="now-playing">playing x of y</div>
        <div class="track-art"></div>
        <div class="track-name">track name</div>
        <div class="track-artist">track artist</div> 
      </div>

      <!-- Define the section for displaying track buttons -->
      <div class="buttons">
        <div class="shuffle-track" onclick="toggleShuffle()">
          <i class="fa fa-random"></i>
        </div>

        <div class="prev-track" onclick="prevTrack()">
          <i class="fa fa-step-backward fa-2x"></i>
        </div>
        <div class="playpause-track" onclick="playpauseTrack()">
          <i class="fa fa-play-circle fa-5x"></i>
        </div>
        <div class="next-track" onclick="nextTrack()">
          <i class="fa fa-step-forward fa-2x"></i>
        </div>
        <div class="save-offline" onclick="toggleOfflineForCurrentTrack()">
          <i class="fa fa-download"></i>
        </div>
      </div>

      <!-- Define the section for displaying the seek slider-->
      <div class="slider-container">
        <div class="current-time">00:00</div>
          <input type="range" min="1" max="100" value="0" class="seek-slider" onchange="seekTo()">
          <div class="total-duration">00:00</div>
        </div>
      </div>
      <div class="queue-container">
        <div class="queue-header" onclick="toggleQueue()">
          <span class="queue-arrow">▶</span> up next
        </div>
        <div class="queue-list collapsed">
          <ul class="queue-list-inner"></ul>
        </div>
      </div>
    </div>
  </body>
</html>
